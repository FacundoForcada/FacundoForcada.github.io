name: Spell Check

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.html'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.html'

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run check-spelling
        uses: check-spelling/check-spelling@v0.0.20
        with:
          config: .github/actions/spell-check.yml
